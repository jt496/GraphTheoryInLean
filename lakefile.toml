name = "GraphTheoryInLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GraphTheoryInLean"]
# The chapters are plain (non-`module`) Lean files: no warning for their
# imports from Mathlib, which uses the module system.
allowNonModules = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine.maxLineLength = 85
weak.linter.style.missingEnd = false
weak.linter.style.header = false
maxSynthPendingDepth = 3

# Pinned to the Mathlib commit the guide was built against.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "237c53b714060dd21b54c29e7e3256ec0c65f132"

[[lean_lib]]
name = "GraphTheoryInLean"
