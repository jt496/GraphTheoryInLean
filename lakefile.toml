name = "GraphTheoryInLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GraphTheoryInLean"]
# The chapters are plain (non-`module`) Lean files: no warning for their
# imports from Mathlib, which uses the module system.
allowNonModules = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.missingEnd = false
weak.linter.style.header = false
maxSynthPendingDepth = 3
weak.linter.style.longLine = false

# Pinned to the Mathlib commit the guide was built against.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "4e34ea5e18ddfad7aae4c0d98a2ae1acbe906e97"

[[lean_lib]]
name = "GraphTheoryInLean"
