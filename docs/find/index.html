window.onload = async () => {

    // Don't show hovers inside of closed tactic states
    function blockedByTactic(elem) {
      let parent = elem.parentNode;
      while (parent && "classList" in parent) {
        if (parent.classList.contains("tactic")) {
          const toggle = parent.querySelector(":scope > input.tactic-toggle");
          if (toggle) {
            return !toggle.checked;
          }
        }
        parent = parent.parentNode;
      }
      return false;
    }

    // The innermost element under the pointer, used to show only the most specific hover
    let hoverTarget = null;
    document.addEventListener('mouseover', (e) => { hoverTarget = e.target; }, true);

    // Visible tippy references; a tooltip is blocked while an unrelated one is visible
    const visibleTippies = new Set();
    function blockedByTippy(elem) {
      for (const ref of visibleTippies) {
        if (!ref.contains(elem) && !elem.contains(ref)) return true;
      }
      return false;
    }

    // Whether the element's tooltip would have content to show. Content nested in a
    // collapsed tactic region is covered by the region's proof-state tooltip, whether or
    // not a tippy instance is currently attached to it.
    function showsContent(el) {
      if (!el._tippy) return false;
      if (el.classList.contains('tactic')) {
        const toggle = el.querySelector(':scope > input.tactic-toggle');
        return !!toggle && !toggle.checked;
      }
      return (!!el.querySelector('.hover-info') || 'versoHover' in el.dataset) &&
        !blockedByTactic(el);
    }

    // The nearest enclosing element whose tooltip has content
    function innermostShowable(el) {
      while (el && el.nodeType === Node.ELEMENT_NODE) {
        if (showsContent(el)) return el;
        el = el.parentElement;
      }
      return null;
    }

    // Binding highlights via event delegation with cached lookups
    const bindingCache = new Map(); // context+binding -> [token elements]
    let highlightedTokens = [];
    function getBindingTokens(context, binding) {
      const key = context + "\0" + binding;
      let tokens = bindingCache.get(key);
      if (!tokens) {
        tokens = [];
        for (const example of document.querySelectorAll(".hl.lean")) {
          if (example.dataset.leanContext == context) {
            for (const tok of example.querySelectorAll(".token[data-binding=\"" + CSS.escape(binding) + "\"]")) {
              tokens.push(tok);
            }
          }
        }
        bindingCache.set(key, tokens);
      }
      return tokens;
    }
    for (const container of document.querySelectorAll(".hl.lean")) {
      container.addEventListener("mouseover", (event) => {
        const c = event.target.closest(".token");
        if (!c || !c.dataset.binding || c.dataset.binding === "" || !container.contains(c)) return;
        if (blockedByTactic(c)) return;
        const tokens = getBindingTokens(container.dataset.leanContext, c.dataset.binding);
        for (const tok of tokens) {
          tok.classList.add("binding-hl");
        }
        highlightedTokens = tokens;
      });
      container.addEventListener("mouseout", (event) => {
        const c = event.target.closest(".token");
        if (!c || !container.contains(c)) return;
        for (const tok of highlightedTokens) {
          tok.classList.remove("binding-hl");
        }
        highlightedTokens = [];
      });
    }
    /* Render docstrings */
    if ('undefined' !== typeof marked) {
        for (const d of document.querySelectorAll("code.docstring, pre.docstring")) {
            const str = d.innerText;
            const html = marked.parse(str);
            const rendered = document.createElement("div");
            rendered.classList.add("docstring");
            rendered.innerHTML = html;
            d.parentNode.replaceChild(rendered, d);
        }
    }
    // Add hovers
    const versoDocData = await (fetch("-verso-docs.json").then((resp) => resp.json()));

    function hideParentTooltips(element) {
      let parent = element.parentElement;
      while (parent) {
        const tippyInstance = parent._tippy;
        if (tippyInstance) {
          tippyInstance.hide();
        }
        parent = parent.parentElement;
      }
    }

    function hideDescendantTooltips(element) {
      for (const ref of visibleTippies) {
        if (ref !== element && element.contains(ref)) {
          ref._tippy.hide();
        }
      }
    }

    // Renders the documentation for a hover ID from the doc table
    function docHoverContent(hoverId) {
      const info = document.createElement('span');
      info.className = 'hover-info';
      info.style.display = 'block';
      const data = versoDocData[hoverId];
      if (data) {
        info.innerHTML = data;
        /* Render docstrings - TODO server-side */
        if ('undefined' !== typeof marked) {
          for (const d of info.querySelectorAll('code.docstring, pre.docstring')) {
            const str = d.innerText;
            const html = marked.parse(str);
            const rendered = document.createElement('div');
            rendered.classList.add('docstring');
            rendered.innerHTML = html;
            d.parentNode.replaceChild(rendered, d);
          }
        }
      } else {
        info.innerHTML = 'Failed to load doc ID: ' + hoverId;
      }
      return info;
    }




    const defaultTippyProps = {

      onHide(any) { return false; },
      trigger: "click",
      // */
      /* theme: "lean", */
      maxWidth: "none",

      interactive: true,
      delay: [100, null],
      /* ignoreAttributes: true, */
      followCursor: 'initial',
      onShow(inst) {
        const ref = inst.reference;
        if (ref.className == 'tactic') {
          const toggle = ref.querySelector(":scope > input.tactic-toggle");
          if (toggle && toggle.checked) {
            return false;
          }
        } else if (ref.querySelector(".hover-info") || "versoHover" in ref.dataset) {
          if (blockedByTactic(ref)) { return false };
        } else { // Nothing to show here!
          return false;
        }
        // Show only the most specific hover under the pointer
        if (hoverTarget && ref.contains(hoverTarget) && innermostShowable(hoverTarget) !== ref) {
          return false;
        }
        hideParentTooltips(ref);
        hideDescendantTooltips(ref);
        if (blockedByTippy(ref)) { return false; }
      },
      onShown(inst) { visibleTippies.add(inst.reference); },
      onHidden(inst) { visibleTippies.delete(inst.reference); },
      content (tgt) {
        const content = document.createElement("span");
        if (tgt.className == 'tactic') {
          const state = tgt.querySelector(":scope > .tactic-state").cloneNode(true);
          state.style.display = "block";
          content.appendChild(state);
          content.style.display = "block";
          content.className = "hl lean popup";
        } else {
          content.className = "hl lean";
          content.style.display = "block";
          content.style.maxHeight = "300px";
          content.style.overflowY = "auto";
          content.style.overflowX = "hidden";
          // Messages come from the inline hover-info; documentation comes from the doc
          // table. An element with both (a message span sharing a documented token's
          // extent) shows both in one tooltip.
          const hoverId = tgt.dataset.versoHover;
          const hoverInfo = tgt.querySelector(".hover-info");
          if (hoverInfo) {
            content.appendChild(hoverInfo.cloneNode(true));
          }
          if (hoverId) {
            // TODO stop doing an implicit conversion from string to number here
            content.appendChild(docHoverContent(hoverId));
          }
          if (hoverInfo && hoverId) {
            content.classList.add('mixed');
          }
          const extraLinks = tgt.dataset['versoLinks'] || tgt.parentElement.dataset['versoLinks'];
          if (extraLinks) {
            try {
              const extras = JSON.parse(extraLinks);
              const links = document.createElement('ul');
              links.className = 'extra-doc-links';
              extras.forEach((l) => {
                const li = document.createElement('li');
                li.innerHTML = "<a href=\"" + l['href'] + "\" title=\"" + l.long + "\">" + l.short + "</a>";
                links.appendChild(li);
              });
              content.appendChild(links);
            } catch (error) {
              console.error(error);
            }
          }
        }
        return content;
      }
    };


    document.querySelectorAll('.hl.lean .const.token, .hl.lean .keyword.token, .hl.lean .literal.token, .hl.lean .option.token, .hl.lean .var.token, .hl.lean .typed.token, .hl.lean .level-var, .hl.lean .level-const, .hl.lean .level-op, .hl.lean .sort').forEach(element => {
      element.setAttribute('data-tippy-theme', 'lean');
    });
    document.querySelectorAll('.hl.lean .has-info.warning').forEach(element => {
      element.setAttribute('data-tippy-theme', 'warning message');
    });
    document.querySelectorAll('.hl.lean .has-info.information').forEach(element => {
      element.setAttribute('data-tippy-theme', 'info message');
    });
    document.querySelectorAll('.hl.lean .has-info.error').forEach(element => {
      element.setAttribute('data-tippy-theme', 'error message');
    });
    document.querySelectorAll('.hl.lean .tactic').forEach(element => {
      element.setAttribute('data-tippy-theme', 'tactic');
    });
    // Skip tokens inside closed tactics — they interfere with tactic tippys
    const closedTactics = new Set();
    document.querySelectorAll('.hl.lean .tactic').forEach(tactic => {
      const toggle = tactic.querySelector(':scope > input.tactic-toggle');
      if (toggle && !toggle.checked) closedTactics.add(tactic);
    });
    function isInsideClosedTactic(el) {
      const tactic = el.closest('.tactic');
      return tactic && tactic !== el && closedTactics.has(tactic);
    }

    const tokenSelector = '.hl.lean .const.token, .hl.lean .keyword.token, .hl.lean .literal.token, .hl.lean .option.token, .hl.lean .var.token, .hl.lean .typed.token, .hl.lean .has-info, .hl.lean .tactic, .hl.lean .level-var, .hl.lean .level-const, .hl.lean .level-op, .hl.lean .sort';
    tippy(Array.from(document.querySelectorAll(tokenSelector)).filter(el => !isInsideClosedTactic(el)), defaultTippyProps);

    const tacticTippySelector = '.const.token, .keyword.token, .literal.token, .option.token, .var.token, .typed.token, .has-info, .level-var, .level-const, .level-op, .sort';
    document.querySelectorAll('.hl.lean .tactic').forEach(tactic => {
      const toggle = tactic.querySelector(':scope > input.tactic-toggle');
      if (toggle) toggle.addEventListener('change', () => {
        if (toggle.checked) {
          closedTactics.delete(tactic);
          tactic.querySelectorAll(tacticTippySelector).forEach(el => {
            if (!el._tippy) {
              tippy(el, defaultTippyProps);
            }
          });
        } else {
          closedTactics.add(tactic);
          tactic.querySelectorAll(tacticTippySelector).forEach(el => {
            if (el._tippy) el._tippy.destroy();
          });
        }
        // The toggle changes which element's tooltip belongs to the pointer's position,
        // but the pointer stays put, so no hover event announces the change. Show the
        // right tooltip once the click that flipped the toggle has hidden the old one.
        setTimeout(() => {
          if (hoverTarget && hoverTarget.isConnected) {
            const showable = innermostShowable(hoverTarget);
            if (showable && showable._tippy) showable._tippy.show();
          }
        }, 0);
      });
  });
}

// Enable typescript
// @ts-check
/**
 * @type URLSearchParams
 */
let params = new URLSearchParams(document.location.search);
/**
 * @type string[]
 */
let domains = params.getAll("domain");
/**
 * @type string | null
 */
let paramName = params.get("name");

/**
 * @typedef {{id: string, address: string, data: any}} Item // Metadata for one particular item. The `data` depends on the domain.
 * @typedef {Record<string, Item[]>} DomainData // A mapping from canonical names to metadata. The array is usually a singleton.
 * @typedef {{title: string | null, description: string | null, contents: DomainData}} Domain
 * @typedef {Record<string, Domain>} XRef
 */

let xref = /** @type {{xref: XRef}} */ (/** @type {unknown} */ (window)).xref;

/**
 * The replacements for characters that are not valid in slugs. This mirrors the mangling table in
 * MultiVerso.Slug.
 * @type {Record<string, string>}
 */
const slugReplacements = {
    "<": "_LT_",
    ">": "_GT_",
    ";": "_SEMI_",
    "‹": "_FLQ_",
    "›": "_FRQ_",
    "«": "_FLQQ_",
    "»": "_FLQQ_",
    "⟨": "_LANGLE_",
    "⟩": "_RANGLE_",
    "(": "_LPAR_",
    ")": "_RPAR_",
    "[": "_LSQ_",
    "]": "_RSQ_",
    "→": "_ARR_",
    "↦": "_MAPSTO_",
    "⊢": "_VDASH_",
};

/**
 * Converts a string to a valid slug, mangling as appropriate. This mirrors the slug computation in
 * MultiVerso.Slug, so names can be compared with links that were minted from their slugs.
 * @param {string} s
 * @returns {string}
 */
function sluggify(s) {
    let out = "";
    for (const c of s) {
        if (/^[a-zA-Z0-9_-]$/.test(c)) out += c;
        else if (c === " " || c === "\t" || c === "\r" || c === "\n") out += "-";
        else out += slugReplacements[c] ?? "___";
    }
    return out;
}

if (paramName) {
    /**
     * @type (Item & {domain: string})[]
     */
    let options = [];
    if (domains && domains.length > 0) {
        for (const i in domains) {
            let domain = domains[i];
            console.log("Considering domain " + domain);
            if (xref.hasOwnProperty(domain)) {
                console.log("Found domain " + domain);
                let opts = xref[domain];
                if (opts["contents"].hasOwnProperty(paramName)) {
                    options = opts["contents"][paramName].map((x) =>
                        Object.assign(x, { domain: domain }),
                    );
                }
            }
        }
    } else {
        for (const [dom, opts] of Object.entries(xref)) {
            if (opts["contents"].hasOwnProperty(paramName)) {
                for (const i of opts["contents"][paramName]) {
                    options.push(Object.assign(i, { domain: dom }));
                }
            }
        }
    }

    if (options.length == 0) {
        // Permalinks from before a bug fix that separated sections' HTML IDs from their
        // canonical names in the section domain were mangled as slugs. If we don't find
        // any results, we try to recover by checking equality modulo sluggification.
        // This workaround was introduced in August 2026 and should be removed when it
        // seems unlikely for old permalinks to be a significant problem.
        const nameSlug = sluggify(paramName);
        const searchDomains = domains && domains.length > 0 ? domains : Object.keys(xref);
        for (const domain of searchDomains) {
            if (!xref.hasOwnProperty(domain)) continue;
            const contents = xref[domain]["contents"];
            for (const key of Object.keys(contents)) {
                if (sluggify(key) === nameSlug) {
                    for (const i of contents[key]) {
                        options.push(Object.assign(i, { domain: domain }));
                    }
                }
            }
        }
    }

    if (options.length == 0) {
        addEventListener("DOMContentLoaded", (_event) => {
            document.title = "Not found: '" + paramName + "'";
            const titleElem = document.querySelector("#title");
            if (titleElem) {
                titleElem.innerHTML = "Not found: name '" + paramName + "'";
            }
            let allDomains = [];
            for (const d in xref) {
                allDomains.push(d);
            }
            if (domains.length < 1) {
                domains = allDomains;
            }
            const messageElem = document.querySelector("#message");
            if (messageElem) {
                messageElem.innerHTML = `
                    <p>Searched domains:</p>
                    <ul>
                        ${domains
                            .map((x) => `<li><code>${x}</code>: ${xref[x]["title"]}</li>`)
                            .join("")}
                    </ul>
                `;
            }
        });
    } else if (options.length == 1) {
        // Currently, our stored options look like absolute paths ('/Axiom').
        // This makes them relative ('Axiom') so that they will be set relative to the <base> tag
        const addr = new URL(options[0]["address"].replace(/^\//, ""), document.baseURI);
        addr.hash = options[0]["id"];
        window.location.replace(addr);
    } else {
        addEventListener("DOMContentLoaded", (_event) => {
            document.title = "Ambiguous: '" + paramName + "'";
            const titleElem = document.querySelector("#title");
            if (titleElem) {
                titleElem.innerHTML = "Ambiguous: name '" + paramName + "'";
            }
            const messageElem = document.querySelector("#message");
            if (messageElem) {
                messageElem.innerHTML = `
                    <p>Options:</p>
                    <ul>
                        ${options
                            .map(
                                (x, _idx) =>
                                    `<li>
                                <p>
                                    <a href="${x["address"] + "#" + x["id"]}">
                                        From ${xref[x["domain"]]["title"]}
                                    </a>
                                </p>
                            </li>`,
                            )
                            .join("\n")} +
                    </ul>
                `;
            }
        });
    }
} else {
    addEventListener("DOMContentLoaded", (_event) => {
        document.title = "No name provided";
        const titleElem = document.querySelector("#title");
        if (titleElem) {
            titleElem.innerHTML = "No name provided";
        }
        const messageElem = document.querySelector("#message");
        if (messageElem) {
            messageElem.innerHTML = `
                <p>This page expects a 'name' query parameter, along with documentation domains.</p>
            `;
        }
    });
}
</script>

window.addEventListener("DOMContentLoaded", function () {

/* Clicking a marker pins its note open.

   Hovering alone is not enough: the Lean hover tooltips are appended to
   `document.body`, outside the footnote span, so as soon as the pointer touches
   one the span loses `:hover` and the note closes — dropping the pointer onto the
   prose underneath, whose tooltips then appear instead. A pinned note survives
   that. Closes on a second click, on Escape, or on a click elsewhere; clicks
   inside the note or inside a tooltip keep it open. */
window.addEventListener("DOMContentLoaded", function () {
  function closeAll() {
    var open = document.querySelectorAll("span.stil-footnote.stil-footnote-open");
    for (var i = 0; i < open.length; i++) {
      open[i].classList.remove("stil-footnote-open");
    }
  }
  document.addEventListener("click", function (e) {
    if (!e.target || !e.target.closest) { return; }
    var ref = e.target.closest("span.stil-footnote-ref");
    if (ref) {
      var note = ref.closest("span.stil-footnote");
      var wasOpen = note.classList.contains("stil-footnote-open");
      closeAll();
      if (!wasOpen) { note.classList.add("stil-footnote-open"); }
      e.preventDefault();
      return;
    }
    if (e.target.closest("span.stil-footnote-content") ||
        e.target.closest("[data-tippy-root]")) { return; }
    closeAll();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeAll(); }
  });
});
</script>
